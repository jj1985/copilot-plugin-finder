name: nightly scan and site

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly
  workflow_dispatch:
    inputs:
      group:
        description: "marker groups (comma-separated)"
        default: "copilot-authored,pointers"

concurrency:
  group: cpf-scan
  cancel-in-progress: false

permissions:
  contents: write   # upload the database snapshot to the data-latest release
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/index.sqlite
          key: cpf-db-${{ github.run_id }}
          restore-keys: cpf-db-

      - name: Bootstrap database from the data-latest release when the cache is empty
        if: hashFiles('data/index.sqlite') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download data-latest --repo "${{ github.repository }}" --pattern index.sqlite --dir data; then
            echo "seeded data/index.sqlite from the data-latest release ($(du -h data/index.sqlite | cut -f1))"
          else
            echo "no data-latest release; starting from an empty database"
          fi

      - name: Install
        run: uv sync --group dev

      - name: Test
        run: uv run pytest -q

      - name: Scan (discover, verify, expand, golden, dedup, export)
        env:
          # A fine-grained PAT (public read) is required for discovery: with the default GITHUB_TOKEN,
          # code search answers with retry-after 736 s per request and GraphQL is capped at 1,000 points/h
          # (measured 2026-10-23). Without the PAT the run refreshes the seeded database only.
          CPF_PAT: ${{ secrets.CPF_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CPF_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          if [ -n "$CPF_PAT" ]; then
            echo "using CPF_GITHUB_TOKEN: full scan (discover + refresh)"
            uv run cpf scan --group "${{ github.event.inputs.group || 'copilot-authored,pointers' }}" | tee data/scan-summary.json
          else
            echo "no CPF_GITHUB_TOKEN secret: refresh-only run (no code search)"
            uv run cpf scan --no-discover | tee data/scan-summary.json
          fi

      - name: Site data
        env:
          PYTHONUTF8: "1"
        run: uv run cpf site

      - name: Build site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/index.sqlite
          key: cpf-db-${{ github.run_id }}

      - name: Publish database snapshot to the data-latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import sqlite3
          c = sqlite3.connect("data/index.sqlite")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.execute("VACUUM INTO 'data/index-snapshot.sqlite'")
          c.close()
          EOF
          mv data/index-snapshot.sqlite index.sqlite
          gh release view data-latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create data-latest --repo "${{ github.repository }}" --title "Database snapshot (rolling)" --notes "Rolling SQLite snapshot written by the nightly scan; used to seed new runners." --latest=false
          gh release upload data-latest index.sqlite --repo "${{ github.repository }}" --clobber

      - name: Upload exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpf-export-${{ github.run_id }}
          path: |
            data/export/
            data/scan-summary.json
            docs/dedup-audit.md
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
